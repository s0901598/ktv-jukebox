# 每天台灣時間 18:20 自動幫 tools/songs-*.txt 裡還沒找的歌找伴唱版,更新歌庫
# 每次最多找 70 首,留約 30 次搜尋額度給當天晚上的派對使用
name: 每日更新歌庫

on:
  schedule:
    - cron: "20 10 * * *"   # UTC 10:20 = 台灣 18:20
  workflow_dispatch:         # 也可以在 GitHub 的 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 歌單預計 10/17 找完,2026/10/20(台灣時間)起自動排程不再找歌;手動按「Run workflow」不受影響
      - name: 檢查是否已停止自動排程
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Taipei date +%F)" \> "2026-10-19" ]; then
            echo "2026/10/20 起停止自動更新歌庫"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: 找伴唱版連結
        if: steps.gate.outputs.skip != 'true'
        run: python3 tools/build_library.py --max 70 tools/songs-*.txt

      - name: 有新歌就存回 repo
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "ktv-library-bot"
          git config user.email "ktv-library-bot@users.noreply.github.com"
          git add data/library.json data/not-found.json
          if git diff --cached --quiet; then
            echo "沒有新歌"
          else
            git commit -m "每日更新歌庫"
            git push
          fi
