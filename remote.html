<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 加入主畫面後像 App 一樣全畫面開啟 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KTV點唱機">
  <meta name="theme-color" content="#d93c45">
  <title>點歌 - KTV 點唱機</title>
  <link rel="stylesheet" href="css/style.css?v=202610132200">
  <script>
    // 從 LINE 點開時:先試著直接打開 Chrome(播放端要用 Chrome,YouTube Premium 才會生效);
    // 沒裝 Chrome(1.5 秒內沒跳走)就改用外部瀏覽器(LINE 看到 openExternalBrowser=1 會跳到預設瀏覽器)
    if (/\bLine\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1/.test(location.search)) {
      const u = new URL(location.href);
      u.searchParams.set("openExternalBrowser", "1");
      let left = false;
      document.addEventListener("visibilitychange", () => { if (document.hidden) left = true; });
      setTimeout(() => { if (!left) location.replace(u.href); }, 1500);
      location.href = "googlechromes://" + u.host + u.pathname + u.search;
    }
  </script>
  <script>try { const t = localStorage.getItem("ktv-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}</script>
</head>
<body class="with-tabs scroll-y">
  <main class="mobile">
    <div class="topbar">
      <span>派對 <strong id="code-label"></strong></span>
      <span>我是 <b id="name-label"></b> <button class="theme-toggle" data-theme-toggle type="button">🌙</button></span>
    </div>

    <!-- ===== 歌庫 ===== -->
    <div id="view-library">
      <section class="card">
        <h2>📚 歌庫 <small id="lib-count"></small></h2>
        <input id="lib-filter" type="search" placeholder="打歌名或歌手,馬上篩選" autocomplete="off">
        <div class="chips" id="lib-chips">
          <button data-cat="all" class="active">全部</button>
          <button data-cat="國語">國語</button>
          <button data-cat="台語">台語</button>
          <button data-cat="duet">👫 對唱</button>
          <button data-cat="group">🎸 團體</button>
        </div>
        <ul class="song-list" id="lib-list"></ul>
        <div id="lib-empty" class="empty" hidden>
          歌庫裡沒有,<button class="btn secondary" id="lib-to-search" type="button">到「搜尋」找 YouTube</button>
        </div>
      </section>
    </div>

    <!-- ===== 搜尋(歌庫 + YouTube) ===== -->
    <div id="view-search" hidden>
      <section class="card">
        <h2>🔍 搜尋歌曲</h2>
        <form id="search-form" autocomplete="off" class="search-row">
          <input id="keyword" type="search" enterkeyhint="search" placeholder="歌名或歌手" required>
          <button class="btn" type="submit">搜尋</button>
        </form>
        <div class="msg" id="search-msg"></div>
        <ul class="song-list results" id="results"></ul>
        <button class="btn secondary" id="yt-more" type="button" hidden>在 YouTube 搜尋更多版本</button>
        <a class="btn secondary yt-link" id="yt-link" href="https://www.youtube.com/" target="_blank" rel="noopener">到 YouTube 找(不限次數)</a>
      </section>

      <details class="card paste-card" id="paste-card">
        <summary>貼上 YouTube 連結點歌</summary>
        <form id="add-form" autocomplete="off">
          <input id="link" type="text" inputmode="url" placeholder="https://youtu.be/..." required>
          <div class="btn-pair">
            <button class="btn" type="submit" value="add">點歌</button>
            <button class="btn alt" type="submit" value="next">插播</button>
          </div>
          <div class="msg" id="add-msg"></div>
        </form>
      </details>
    </div>

    <!-- ===== 待播放 ===== -->
    <div id="view-queue" hidden>
      <section class="card now-playing">
        <h2>🎵 正在播放</h2>
        <ul class="song-list" id="now"></ul>
        <div class="controls" id="controls" hidden>
          <button class="btn secondary" id="pause-btn">⏸ 暫停</button>
          <button class="btn danger" id="skip-btn">⏭ 切歌</button>
        </div>
      </section>

      <section class="card">
        <h2>接下來</h2>
        <ul class="song-list" id="queue"></ul>
        <div class="pager" id="queue-pager" hidden></div>
      </section>
    </div>

    <!-- ===== 已播放 ===== -->
    <div id="view-history" hidden>
      <section class="card">
        <h2>🕘 已播放</h2>
        <ul class="song-list" id="history"></ul>
        <div class="pager" id="history-pager" hidden></div>
      </section>
    </div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="library" class="active"><span class="ic">📚</span>歌庫</button>
    <button data-tab="search"><span class="ic">🔍</span>搜尋</button>
    <button data-tab="queue"><span class="ic">🎵</span>待播放<span class="count" id="queue-count"></span></button>
    <button data-tab="history"><span class="ic">🕘</span>已播放</button>
  </nav>

  <div class="ended" id="ended" hidden>
    <div class="ended-card">
      <div class="ended-icon">🎤</div>
      <h2>派對已結束</h2>
      <p>謝謝大家,下次再一起唱!</p>
      <a class="btn" href="./">回首頁</a>
    </div>
  </div>

  <div class="toast-m" id="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-go" hidden>看播放清單</button>
  </div>

  <script type="module" src="js/theme.js?v=202610132200"></script>
  <script type="module">
    import {
      subscribe, addSong, skipSong, moveToNext, removeSong, setPaused,
      parseYouTubeId, fetchTitle, escapeHtml,
    } from "./js/party.js";
    import { searchSongs, youtubeSearchUrl, QuotaExceededError } from "./js/youtube.js";
    import { searchLibrary, filterLibrary, loadLibrary, collect, displayTitle, guessArtist } from "./js/library.js";

    const $ = (id) => document.getElementById(id);
    const code = new URLSearchParams(location.search).get("code") || "";
    const name = localStorage.getItem("ktv-name");
    if (!/^[0-9]{4}$/.test(code) || !name) location.replace(`./?code=${code}`);

    $("code-label").textContent = code;
    $("name-label").textContent = name;

    // ---------- 分頁切換 ----------
    const TABS = ["library", "search", "queue", "history"];
    function showTab(tab) {
      for (const t of TABS) $(`view-${t}`).hidden = t !== tab;
      for (const b of $("tabbar").children) b.classList.toggle("active", b.dataset.tab === tab);
      scrollTo(0, 0);
    }
    $("tabbar").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tab]");
      if (b) showTab(b.dataset.tab);
    });
    $("toast-go").addEventListener("click", () => { $("toast").hidden = true; showTab("queue"); });

    // ---------- 提示 ----------
    let toastTimer = null;
    function toast(text, { go = false } = {}) {
      $("toast-text").textContent = text;
      $("toast-go").hidden = !go;
      $("toast").hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $("toast").hidden = true; }, go ? 8000 : 6000);
    }
    // 大螢幕自動跳過、別人切歌等提示,只顯示加入之後發生的
    let lastNoticeAt = Date.now();
    function showNotice(n) {
      if (!n || n.at <= lastNoticeAt) return;
      lastNoticeAt = n.at;
      toast(n.text);
    }
    const placeText = (position) =>
      position === 0 ? "馬上播放" : position === 1 ? "下一首就播" : `排在第 ${position} 首`;

    // ---------- 待播放/已播放分頁:一頁 10 首 ----------
    const PAGE_SIZE = 10;
    const pages = { queue: 0, history: 0 };
    // 畫出換頁按鈕,回傳這一頁從第幾首開始;清單變短時退到最後一頁,清單更新時停在原本那頁
    function pageStart(key, total) {
      const count = Math.max(1, Math.ceil(total / PAGE_SIZE));
      pages[key] = Math.min(pages[key], count - 1);
      const pager = $(`${key}-pager`);
      pager.hidden = total <= PAGE_SIZE;
      pager.innerHTML = `
        <button class="btn secondary" data-step="-1" ${pages[key] === 0 ? "disabled" : ""}>‹ 上一頁</button>
        <span>第 ${pages[key] + 1} / ${count} 頁</span>
        <button class="btn secondary" data-step="1" ${pages[key] === count - 1 ? "disabled" : ""}>下一頁 ›</button>`;
      return pages[key] * PAGE_SIZE;
    }
    function bindPager(key, render) {
      $(`${key}-pager`).addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-step]");
        if (!btn || btn.disabled) return;
        pages[key] += Number(btn.dataset.step);
        render();
        $(key).closest(".card").scrollIntoView({ block: "start" });
      });
    }

    // ---------- 播放中 ----------
    let party = null;

    const queueRow = (s, i) => `
      <li>
        ${i ? `<span class="num">${i}</span>` : ""}
        <img src="https://i.ytimg.com/vi/${encodeURIComponent(s.videoId)}/mqdefault.jpg" alt="">
        <div class="info">
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="by">${escapeHtml(s.by)} 點的</div>
        </div>
        ${i ? `<div class="row-btns">
          ${i >= 2 ? `<button class="mini" data-act="next" data-id="${s.id}">⬆ 插播</button>` : ""}
          <button class="mini danger" data-act="del" data-id="${s.id}">刪除</button>
        </div>` : ""}
      </li>`;

    subscribe(code, (p) => {
      party = p;
      if (!p) {
        $("now").innerHTML = `<li class="empty">派對已結束</li>`;
        $("queue").innerHTML = "";
        $("queue-pager").hidden = true;
        $("controls").hidden = true;
        $("ended").hidden = false;
        return;
      }
      showNotice(p.notice);
      const current = p.queue[0];
      $("now").innerHTML = current ? queueRow(current, 0) : `<li class="empty">還沒有人點歌</li>`;
      $("controls").hidden = !current;
      $("pause-btn").textContent = p.paused ? "▶ 繼續播放" : "⏸ 暫停";
      renderQueue();
      $("queue-count").textContent = p.queue.length ? p.queue.length : "";
      renderHistory();
    });

    function renderQueue() {
      const rest = party?.queue.slice(1) || [];
      const start = pageStart("queue", rest.length);
      $("queue").innerHTML = rest.length
        ? rest.slice(start, start + PAGE_SIZE).map((s, i) => queueRow(s, start + i + 1)).join("")
        : `<li class="empty">清單是空的,快來點歌</li>`;
    }
    bindPager("queue", renderQueue);

    $("pause-btn").addEventListener("click", () => {
      if (party?.queue[0]) setPaused(code, !party.paused);
    });

    $("skip-btn").addEventListener("click", () => {
      const current = party?.queue[0];
      if (!current) return;
      if (confirm(`確定要切掉「${current.title}」嗎?`)) skipSong(code, current.id, name);
    });

    $("queue").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const song = party?.queue.find((s) => s.id === btn.dataset.id);
      if (!song) return;
      if (btn.dataset.act === "next") {
        moveToNext(code, song.id);
        toast(`「${song.title}」插播到下一首`);
      } else if (confirm(`確定要刪除「${song.title}」嗎?`)) {
        removeSong(code, song.id, name);
      }
    });

    // ---------- 搜尋 ----------
    let results = [];

    $("keyword").addEventListener("input", () => {
      const q = $("keyword").value.trim();
      $("yt-link").href = q ? youtubeSearchUrl(q) : "https://www.youtube.com/";
    });

    // 可以點歌/插播的歌曲列(歌庫、搜尋結果、已播放共用)
    const pickRow = (s, i, extra = "") => `
      <li>
        <img src="https://i.ytimg.com/vi/${encodeURIComponent(s.videoId)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="info">
          <div class="title">${escapeHtml(s.song || s.title)}</div>
          ${s.artist ? `<div class="singer">🎙 ${escapeHtml(s.artist)} 演唱</div>` : ""}
          ${extra || `<div class="by">
            ${s.fromLibrary ? `<span class="badge lib">⭐ 歌庫</span>` : ""}${s.duet ? `<span class="badge duet">👫 對唱</span>` : ""}${s.group ? `<span class="badge group">🎸 團體</span>` : ""}${s.karaoke ? `<span class="badge">🎤 伴唱版</span>` : ""}
            ${[s.duration, s.lang, !s.artist && s.channel ? `頻道:${s.channel}` : ""].filter(Boolean).map(escapeHtml).join(" · ")}
          </div>`}
        </div>
        <div class="pick-col">
          <button class="pick" data-i="${i}" data-mode="add">點歌</button>
          <button class="pick alt" data-i="${i}" data-mode="next">插播</button>
        </div>
      </li>`;
    const resultRow = (s, i) => pickRow(s, i);

    // 每個清單點「點歌/插播」的共用處理;getList 回傳該清單目前的歌曲陣列
    function bindPicks(ul, getList) {
      ul.addEventListener("click", async (e) => {
        const btn = e.target.closest(".pick");
        if (!btn || btn.disabled) return;
        const s = getList()[btn.dataset.i];
        if (!s) return;
        const next = btn.dataset.mode === "next";
        const pair = btn.parentElement.querySelectorAll(".pick");
        pair.forEach((b) => { b.disabled = true; });
        btn.textContent = "…";
        try {
          const title = displayTitle(s);
          const { position } = await addSong(code, { videoId: s.videoId, title, by: name }, { next });
          collect(s);
          btn.textContent = next ? "已插播 ✓" : "已點 ✓";
          btn.classList.add("done");
          toast(`已${next ? "插播" : "點歌"}:${title},${placeText(position)}`, { go: true });
        } catch (err) {
          pair.forEach((b) => { b.disabled = false; });
          btn.textContent = next ? "插播" : "點歌";
          toast(err.message || "點歌失敗,請再試一次");
        }
      });
    }

    const render = () => { $("results").innerHTML = results.map(resultRow).join(""); };

    async function searchYouTube(q, btn) {
      const msg = $("search-msg");
      btn.disabled = true;
      msg.className = "msg ok";
      msg.textContent = "到 YouTube 搜尋中…";
      $("yt-more").hidden = true;
      try {
        const known = new Set(results.map((s) => s.videoId));
        const found = (await searchSongs(q)).filter((s) => !known.has(s.videoId));
        for (const s of found) s.artist = await guessArtist(s.title);
        results = [...results, ...found];
        render();
        msg.textContent = results.length ? "" : "找不到相關的歌,換個關鍵字試試";
      } catch (err) {
        msg.className = "msg";
        msg.textContent = err.message || "搜尋失敗,請稍後再試";
        if (err instanceof QuotaExceededError) $("paste-card").open = true;
      } finally {
        btn.disabled = false;
      }
    }

    // 先查歌庫(不扣額度);歌庫沒有才自動搜 YouTube
    $("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = $("keyword").value.trim();
      $("keyword").blur(); // 收起手機鍵盤,才看得到結果
      $("search-msg").textContent = "";
      $("yt-more").hidden = true;
      results = await searchLibrary(q).catch(() => []);
      render();
      if (results.length) {
        $("yt-more").hidden = false;
        $("yt-more").onclick = () => searchYouTube(q, $("yt-more"));
      } else {
        await searchYouTube(q, e.submitter || e.target.querySelector("button"));
      }
    });

    bindPicks($("results"), () => results);

    // ---------- 歌庫 ----------
    let libSongs = [];
    let libCat = "all";
    async function renderLibrary() {
      const q = $("lib-filter").value;
      libSongs = await filterLibrary(q, libCat);
      // 歌庫分頁裡每首都是歌庫的歌,不用再標「⭐ 歌庫」
      $("lib-list").innerHTML = libSongs.map((s, i) => pickRow({ ...s, fromLibrary: false }, i)).join("");
      $("lib-empty").hidden = libSongs.length > 0;
      $("lib-count").textContent = q.trim() || libCat !== "all" ? `${libSongs.length} 首` : `共 ${libSongs.length} 首`;
    }
    let libTimer = null;
    $("lib-filter").addEventListener("input", () => {
      clearTimeout(libTimer);
      libTimer = setTimeout(renderLibrary, 150);
    });
    $("lib-filter").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
    $("lib-chips").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-cat]");
      if (!b) return;
      libCat = b.dataset.cat;
      for (const c of $("lib-chips").children) c.classList.toggle("active", c === b);
      renderLibrary();
    });
    $("lib-to-search").addEventListener("click", () => {
      $("keyword").value = $("lib-filter").value.trim();
      $("keyword").dispatchEvent(new Event("input"));
      showTab("search");
      if ($("keyword").value) $("search-form").requestSubmit();
    });
    bindPicks($("lib-list"), () => libSongs);
    loadLibrary().then(renderLibrary);

    // ---------- 已播放 ----------
    let historyList = [];
    const RESULT_TEXT = { done: "✅ 唱完", skipped: "⏭ 被切掉", unplayable: "⚠️ 無法播放" };
    const hhmm = (t) => new Date(t).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
    function renderHistory() {
      historyList = [...(party?.history || [])].reverse();
      const start = pageStart("history", historyList.length);
      $("history").innerHTML = historyList.length
        ? historyList.slice(start, start + PAGE_SIZE).map((s, i) => pickRow(s, start + i, `<div class="by">${escapeHtml(s.by)} 點的 · ${hhmm(s.endedAt)}<br>${
            RESULT_TEXT[s.result] || ""}${s.result === "skipped" && s.endedBy ? `(${escapeHtml(s.endedBy)})` : ""}</div>`)).join("")
        : `<li class="empty">還沒有唱完的歌</li>`;
    }
    bindPicks($("history"), () => historyList);
    bindPager("history", renderHistory);

    // ---------- 貼連結 ----------
    $("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("add-msg");
      const videoId = parseYouTubeId($("link").value);
      if (!videoId) {
        msg.className = "msg";
        msg.textContent = "看不懂這個連結,請貼 YouTube 影片網址";
        return;
      }
      const next = e.submitter?.value === "next";
      const btns = e.target.querySelectorAll("button");
      btns.forEach((b) => { b.disabled = true; });
      msg.className = "msg ok";
      msg.textContent = "點歌中…";
      try {
        const title = await fetchTitle(videoId);
        const { position } = await addSong(code, { videoId, title, by: name }, { next });
        collect({ videoId, title });
        msg.textContent = "";
        $("link").value = "";
        toast(`已${next ? "插播" : "點歌"}:${title},${placeText(position)}`, { go: true });
      } catch (err) {
        msg.className = "msg";
        msg.textContent = err.message || "點歌失敗,請再試一次";
      } finally {
        btns.forEach((b) => { b.disabled = false; });
      }
    });
  </script>
</body>
</html>
