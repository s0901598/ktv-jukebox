<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 加入主畫面後像 App 一樣全畫面開啟 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KTV點唱機">
  <meta name="theme-color" content="#d93c45">
  <title>KTV 點唱機</title>
  <link rel="stylesheet" href="css/style.css?v=202610151900">
  <script>
    // 從 LINE 點開時:先試著直接打開 Chrome(播放端要用 Chrome,YouTube Premium 才會生效);
    // 沒裝 Chrome(1.5 秒內沒跳走)就改用外部瀏覽器(LINE 看到 openExternalBrowser=1 會跳到預設瀏覽器)
    if (/\bLine\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1/.test(location.search)) {
      const u = new URL(location.href);
      u.searchParams.set("openExternalBrowser", "1");
      let left = false;
      document.addEventListener("visibilitychange", () => { if (document.hidden) left = true; });
      setTimeout(() => { if (!left) location.replace(u.href); }, 1500);
      location.href = "googlechromes://" + u.host + u.pathname + u.search;
    }
  </script>
  <script>try { const t = localStorage.getItem("ktv-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}</script>
</head>
<body class="scroll-y">
  <main class="mobile">
    <div class="home-tools"><button class="theme-toggle" data-theme-toggle type="button">🌙</button></div>
    <h1>🎤 KTV 點唱機</h1>

    <section class="card">
      <h2>加入派對點歌</h2>
      <form id="join-form" autocomplete="off">
        <label for="code">派對代碼(5 位數字)</label>
        <input id="code" class="code-input" type="tel" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required>
        <label for="name">你的暱稱</label>
        <input id="name" type="text" maxlength="12" placeholder="例如:小美、二舅">
        <div class="field-msg" id="name-msg" hidden>請輸入暱稱</div>
        <button class="btn" type="submit">加入</button>
        <div class="msg" id="join-msg"></div>
      </form>
    </section>

    <section class="card">
      <h2>我是播放端(接投影機的手機)</h2>

      <!-- 登入 YouTube 的說明(網頁讀不到 YouTube 有沒有登入,所以一直顯示) -->
      <div class="step" id="yt-step">
        <div class="step-title">① 登入 YouTube(第一次使用時做一次)</div>
        <p class="step-note">按下面「登入 YouTube」,登入有 Premium 的帳號,登入完回到這一頁</p>
        <p class="step-note">建議使用 Chrome 瀏覽器登入</p>
        <a class="btn alt" id="yt-login" href="https://accounts.google.com/ServiceLogin?service=youtube&amp;continue=https%3A%2F%2Fwww.youtube.com%2F" target="_blank" rel="noopener">🔑 登入 YouTube</a>
      </div>

      <div class="step-title" id="create-title">② 建立派對</div>
      <button class="btn" id="create-btn">建立派對</button>
      <div class="msg" id="create-msg"></div>
    </section>
  </main>

  <!-- iPhone Safari 建立派對時,建議改用 Chrome -->
  <div class="dialog" id="use-chrome" hidden>
    <div class="dialog-card">
      <h2>建議用 Chrome 開播放端</h2>
      <p>用 Safari 播放會有廣告;改用 Chrome 並登入 YouTube Premium,才有機會沒有廣告。</p>
      <a class="btn" id="open-chrome" href="#">用 Chrome 開啟</a>
      <button class="btn secondary" id="stay-safari" type="button">繼續用 Safari</button>
    </div>
  </div>

  <script type="module" src="js/theme.js?v=202610132200"></script>
  <script type="module">
    import { createParty, partyStatus } from "./js/party.js";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    $("name").value = localStorage.getItem("ktv-name") || "";
    if (params.get("code")) $("code").value = params.get("code");
    ($("code").value ? $("name") : $("code")).focus();

    // 暱稱空白(或只有空格)時:紅框 + 「請輸入暱稱」,開始輸入就消失
    function showNameError(show) {
      $("name").classList.toggle("invalid", show);
      $("name-msg").hidden = !show;
    }
    $("name").addEventListener("input", () => { if ($("name").value.trim()) showNameError(false); });
    // 從點歌頁因為沒有暱稱被送回來時,直接提示
    if (params.get("need") === "name" && !$("name").value.trim()) showNameError(true);

    $("join-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = $("code").value.trim();
      const name = $("name").value.trim();
      const btn = e.submitter;
      $("join-msg").textContent = "";
      if (!name) {
        showNameError(true);
        $("name").focus();
        return;
      }
      btn.disabled = true;
      try {
        const status = await partyStatus(code);
        if (status !== "ok") {
          $("join-msg").textContent = status === "expired"
            ? "這個派對已超過 12 小時沒有活動,已經結束"
            : "找不到這個派對,請確認代碼";
          return;
        }
        localStorage.setItem("ktv-name", name);
        location.href = `remote.html?code=${code}`;
      } catch (err) {
        $("join-msg").textContent = "連線失敗,請檢查網路後再試一次";
      } finally {
        btn.disabled = false;
      }
    });

    // iPhone/iPad 的 Safari(不是 Chrome、Firefox、Edge、LINE)建立派對時,先建議改用 Chrome
    const ua = navigator.userAgent;
    const isIosSafari = /iP(hone|ad|od)/.test(ua) && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|\bLine\//i.test(ua);
    $("open-chrome").href = "googlechromes://" + location.host + location.pathname;
    $("stay-safari").addEventListener("click", () => { $("use-chrome").hidden = true; createAndGo($("create-btn")); });

    $("create-btn").addEventListener("click", (e) => {
      if (isIosSafari) { $("use-chrome").hidden = false; return; }
      createAndGo(e.target);
    });

    // 從大螢幕按返回鍵回來時,瀏覽器會直接顯示離開當下的畫面(按鈕還是「建立中…」),所以每次顯示都重置
    addEventListener("pageshow", () => {
      $("create-btn").disabled = false;
      $("create-msg").textContent = "";
      $("create-msg").className = "msg";
      $("use-chrome").hidden = true;
      document.querySelectorAll("#join-form button").forEach((b) => (b.disabled = false));
    });

    async function createAndGo(btn) {
      btn.disabled = true;
      $("create-msg").textContent = "建立中…";
      $("create-msg").className = "msg ok";
      try {
        const code = await createParty();
        location.href = `screen.html?code=${code}`;
      } catch (err) {
        $("create-msg").className = "msg";
        $("create-msg").textContent = err.message || "建立失敗,請再試一次";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
