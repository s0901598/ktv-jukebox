<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 加入主畫面後像 App 一樣全畫面開啟 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KTV點唱機">
  <meta name="theme-color" content="#d93c45">
  <title>大螢幕 - KTV 點唱機</title>
  <link rel="stylesheet" href="css/style.css?v=202610131900">
  <script>
    // 從 LINE 點開時:先試著直接打開 Chrome(播放端要用 Chrome,YouTube Premium 才會生效);
    // 沒裝 Chrome(1.5 秒內沒跳走)就改用外部瀏覽器(LINE 看到 openExternalBrowser=1 會跳到預設瀏覽器)
    if (/\bLine\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1/.test(location.search)) {
      const u = new URL(location.href);
      u.searchParams.set("openExternalBrowser", "1");
      let left = false;
      document.addEventListener("visibilitychange", () => { if (document.hidden) left = true; });
      setTimeout(() => { if (!left) location.replace(u.href); }, 1500);
      location.href = "googlechromes://" + u.host + u.pathname + u.search;
    }
  </script>
  <script>try { const t = localStorage.getItem("ktv-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}</script>
</head>
<body class="screen-body no-drag">
  <div id="safe-probe" aria-hidden="true"></div>
  <div class="stage" id="stage">
    <div class="video-area">
      <div id="player"></div>

      <!-- 清單空的時候 -->
      <div class="overlay idle" id="idle">
        <div class="big">輸入代碼 <span class="code" id="idle-code"></span> 快來點歌</div>
        <div id="idle-url"></div>
      </div>

      <!-- 手機瀏覽器要先按一下才允許播放有聲音的影片 -->
      <div class="overlay start" id="start">
        <button class="start-btn" id="start-btn">▶ 開始播放</button>
        <div class="tip" id="start-tip">按一下之後,後面的歌都會自動接著播</div>
        <a class="yt-login" href="https://accounts.google.com/ServiceLogin?service=youtube&amp;continue=https%3A%2F%2Fwww.youtube.com%2F" target="_blank" rel="noopener">🔑 登入 YouTube(有 Premium 可減少廣告)</a>
      </div>

      <!-- 萬一瀏覽器還是擋下自動播放 -->
      <div class="overlay tap" id="tap" hidden>
        <button class="start-btn" id="tap-btn">▶ 點一下繼續播放</button>
      </div>

      <div class="toast" id="toast" hidden></div>
      <div class="paused-pill" id="paused" hidden>⏸ 暫停中</div>

      <!-- 收起資訊欄時:上方跑馬燈顯示下一首、右上角小代碼 -->
      <div class="marquee" id="marquee" hidden><div class="track" id="marquee-track"></div></div>
      <div class="corner-code" id="corner-code" hidden>代碼 <b id="corner-code-num"></b></div>
      <button class="menu-btn" id="menu-open" type="button" hidden aria-label="打開右側資訊欄">☰</button>
    </div>

    <aside class="side">
      <button class="menu-btn side-menu" id="side-close" type="button" aria-label="收起右側資訊欄">☰</button>
      <div class="code-box">
        <div class="code-label">派對代碼</div>
        <div class="code" id="code"></div>
        <div class="join-url" id="join-url"></div>
      </div>
      <div>
        <h3>🎵 正在播放</h3>
        <div class="now" id="now"></div>
      </div>
      <div style="display:flex;flex-direction:column;flex:1;min-height:0">
        <h3>接下來</h3>
        <ul class="queue" id="queue"></ul>
      </div>
      <div class="status" id="status"></div>
      <div class="side-tools">
        <button class="side-tool alt" id="skip-btn" type="button" hidden>⏭ 切歌</button>
        <button class="side-tool danger" id="end-party" type="button">⏹ 結束派對</button>
        <button class="side-tool" id="fs-btn" type="button" hidden>⛶ 全螢幕</button>
        <a class="side-tool" href="https://accounts.google.com/ServiceLogin?service=youtube&amp;continue=https%3A%2F%2Fwww.youtube.com%2F" target="_blank" rel="noopener">🔑 登入</a>
        <button class="side-tool" data-theme-toggle type="button">🌙</button>
      </div>
    </aside>
  </div>

  <script type="module" src="js/theme.js?v=202610131900"></script>
  <script type="module">
    import { subscribe, finishSong, skipSong, setPaused, endParty, joinUrl, escapeHtml } from "./js/party.js";
    import { forget } from "./js/library.js";

    const $ = (id) => document.getElementById(id);
    const code = new URLSearchParams(location.search).get("code") || "";
    if (!/^[0-9]{4}$/.test(code)) location.replace("./");

    // ---------- 依實際看得到的畫面大小排版:畫面填滿可視範圍,字和按鈕依 16:9 比例縮放;直拿時整頁轉成橫版 ----------
    // iPhone Safari 的 100vh 含工具列後面被擋住的高度,轉向或收合工具列時也會變,所以用程式量
    const isTouch = matchMedia("(pointer: coarse)").matches;
    function fitStage() {
      const vv = window.visualViewport;
      if (vv && vv.scale > 1.01) return; // 使用者正在雙指放大,不要重新排版把放大抵銷掉
      const vw = vv ? vv.width : innerWidth;
      const vh = vv ? vv.height : innerHeight;
      // 手機、平板直拿時,把整個畫面順時針轉 90 度,永遠用橫版排列(網頁無法叫手機自己轉向)
      const rotated = isTouch && vh > vw;
      const w = rotated ? vh : vw;
      const h = rotated ? vw : vh;
      document.body.classList.toggle("rotated", rotated);
      const body = document.body.style;
      body.left = `${vv ? vv.offsetLeft : 0}px`;
      body.top = `${vv ? vv.offsetTop : 0}px`;
      body.width = `${w}px`;
      body.height = `${h}px`;
      body.transform = rotated ? `translateX(${vw}px) rotate(90deg)` : "";
      const safeX = parseFloat(getComputedStyle($("safe-probe")).paddingLeft) || 0;
      const u = Math.max(1, Math.min((w - safeX * 2) / 100, h / 56.25));
      $("stage").style.setProperty("--u", `${u}px`);
      scrollTo(0, 0);
    }
    fitStage();
    addEventListener("resize", fitStage);
    addEventListener("orientationchange", () => { fitStage(); setTimeout(fitStage, 300); setTimeout(fitStage, 800); });
    window.visualViewport?.addEventListener("resize", fitStage);
    window.visualViewport?.addEventListener("scroll", fitStage);

    $("code").textContent = code;
    $("join-url").textContent = joinUrl(code);
    $("idle-code").textContent = code;
    $("idle-url").textContent = joinUrl(code);
    $("corner-code-num").textContent = code;

    // ---------- YouTube 播放器 ----------
    const YT_STATE = { UNSTARTED: -1, ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };
    const UNPLAYABLE = [2, 5, 100, 101, 150]; // 101/150 = 影片禁止嵌入,100 = 影片不存在

    let player = null;
    let party = null;
    let unlocked = false;      // 按過「開始播放」了沒
    let loadedSongId = null;   // 播放器目前載入的是哪一首(清單項目的 id)
    let lastPaused = false;
    let watchdog = null;

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: { playsinline: 1, rel: 0, fs: 1, iv_load_policy: 3, origin: location.origin },
        events: {
          onReady: () => sync(),
          onStateChange: (e) => {
            if (e.data === YT_STATE.PLAYING) $("tap").hidden = true;
            // 有人直接點播放端的影片暫停/播放時,也同步回派對狀態,點歌端的按鈕才會一致
            if (loadedSongId && party?.queue[0]?.id === loadedSongId) {
              if (e.data === YT_STATE.PLAYING && party.paused) {
                lastPaused = false;
                setPaused(code, false);
              } else if (e.data === YT_STATE.PAUSED && !party.paused) {
                lastPaused = true;
                setPaused(code, true);
              }
            }
            if (e.data === YT_STATE.ENDED && loadedSongId) finishSong(code, loadedSongId);
          },
          onError: (e) => {
            if (UNPLAYABLE.includes(e.data) && loadedSongId) {
              const bad = party?.queue[0]; // 先記下來,finishSong 會立刻更新本地的 party
              if (bad?.id === loadedSongId) forget(bad.videoId);
              finishSong(code, loadedSongId, { result: "unplayable", notice: "「{title}」無法播放,已自動跳過" });
            }
          },
        },
      });
      window.__player = player; // 方便測試
    };
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    // 依照派對資料決定播放器該做什麼
    function sync() {
      const current = party?.queue[0];
      $("idle").hidden = !!current;
      $("start").hidden = unlocked || !current;
      if (!player?.loadVideoById || !unlocked) return;

      if (!current) {
        if (loadedSongId) player.stopVideo();
        loadedSongId = null;
        setCollapsed(false); // 待機時打開資訊欄,讓新來的人看到代碼
        return;
      }
      if (current.id !== loadedSongId) {
        loadedSongId = current.id;
        setCollapsed(true); // 每首歌開始時自動收起,影片放大

        lastPaused = false;
        player.loadVideoById(current.videoId);
        // 6 秒後還沒開始播,多半是瀏覽器擋自動播放,請人點一下
        clearTimeout(watchdog);
        watchdog = setTimeout(() => {
          const s = player.getPlayerState();
          if (loadedSongId === current.id && (s === YT_STATE.UNSTARTED || s === YT_STATE.CUED)) $("tap").hidden = false;
        }, 6000);
      }
      if (!!party.paused !== lastPaused) {
        lastPaused = !!party.paused;
        if (lastPaused) {
          player.pauseVideo();
        } else {
          player.playVideo();
          // 少數手機會擋下非點擊觸發的播放,沒播起來就請人在大螢幕點一下
          const id = loadedSongId;
          setTimeout(() => {
            const st = player.getPlayerState();
            if (loadedSongId === id && !party?.paused && st !== YT_STATE.PLAYING && st !== YT_STATE.BUFFERING) $("tap").hidden = false;
          }, 2500);
        }
      }
    }

    // ---------- 右側資訊欄收合、跑馬燈 ----------
    let collapsed = false;
    function setCollapsed(c) {
      collapsed = c;
      $("stage").classList.toggle("collapsed", c);
      $("corner-code").hidden = !c;
      $("menu-open").hidden = !c;
      updateMarquee();
    }
    $("menu-open").addEventListener("click", () => setCollapsed(false));
    $("side-close").addEventListener("click", () => setCollapsed(true));

    // 跑馬燈:每首歌開始時跑一次,之後每 40 秒跑一次,跑完就隱藏
    const MARQUEE_EVERY = 40000;
    let marqueeTimer = null;
    let marqueeSongId = null;

    function marqueeText() {
      const next = party?.queue[1];
      return collapsed && party?.queue[0] && next ? `🎤 下一首:${next.title} · ${next.by} 點的,請準備!` : "";
    }

    function runMarquee() {
      const text = marqueeText();
      if (!text) return;
      const track = $("marquee-track");
      track.textContent = text;
      track.style.setProperty("--dur", `${Math.min(30, Math.max(12, text.length * 0.45))}s`);
      track.style.animation = "none";
      void track.offsetWidth; // 重設動畫,從右邊重新跑進來
      track.style.animation = "";
      $("marquee").hidden = false;
    }
    $("marquee-track").addEventListener("animationend", () => { $("marquee").hidden = true; });

    function updateMarquee() {
      const currentId = party?.queue[0]?.id || null;
      if (!marqueeText()) {
        clearInterval(marqueeTimer);
        marqueeTimer = null;
        marqueeSongId = null;
        $("marquee").hidden = true;
        return;
      }
      // 換歌(或剛收起)時重新計時:馬上跑一次,之後每 40 秒一次
      if (!marqueeTimer || marqueeSongId !== currentId) {
        marqueeSongId = currentId;
        clearInterval(marqueeTimer);
        runMarquee();
        marqueeTimer = setInterval(runMarquee, MARQUEE_EVERY);
      }
    }

    // ---------- 開始播放:解鎖聲音、全螢幕、防休眠 ----------
    const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    if (!canFullscreen) {
      $("start-tip").textContent = "按一下之後,後面的歌都會自動接著播";
    }

    $("start-btn").addEventListener("click", () => {
      unlocked = true;
      sync(); // 在點擊當下載入影片,瀏覽器才會允許播放
      enterFullscreen();
      keepAwake();
    });

    $("tap-btn").addEventListener("click", () => {
      player?.playVideo();
      $("tap").hidden = true;
    });

    // 整頁全螢幕(電腦、Android、iPad):影片和右上角漢堡鈕、資訊欄一起放大。
    // iPhone 不支援整頁全螢幕,不顯示這顆;YouTube 播放器自己的全螢幕鈕照樣保留
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    if (canFullscreen) $("fs-btn").hidden = false;
    $("fs-btn").addEventListener("click", () => {
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else enterFullscreen();
    });
    function refreshFsBtn() {
      $("fs-btn").textContent = fsElement() === document.documentElement ? "⛶ 離開全螢幕" : "⛶ 全螢幕";
      fitStage();
    }
    document.addEventListener("fullscreenchange", refreshFsBtn);
    document.addEventListener("webkitfullscreenchange", refreshFsBtn);

    async function enterFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        await screen.orientation?.lock?.("landscape");
      } catch (_) { /* 不支援就算了 */ }
    }

    let wakeLock = null;
    async function keepAwake() {
      if (!("wakeLock" in navigator)) {
        $("status").textContent = "⚠️ 此瀏覽器無法保持螢幕常亮,請到手機設定關閉「自動鎖定」";
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        $("status").textContent = "☀️ 螢幕保持常亮中";
        wakeLock.addEventListener("release", () => { $("status").textContent = ""; });
      } catch (_) {
        $("status").textContent = "⚠️ 無法保持螢幕常亮,請到手機設定關閉「自動鎖定」";
      }
    }
    // 切到別的 App 再回來,常亮會被取消,要重新申請
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && unlocked) keepAwake();
    });

    // ---------- 提示訊息(例如自動跳過) ----------
    let lastNoticeAt = Date.now();
    function showNotice(n) {
      if (!n || n.at <= lastNoticeAt) return;
      lastNoticeAt = n.at;
      $("toast").textContent = n.text;
      $("toast").hidden = false;
      setTimeout(() => { $("toast").hidden = true; }, 6000);
    }

    // ---------- 切歌(跟點歌端一樣帶歌曲 ID,多人同時按也只會跳過一首) ----------
    $("skip-btn").addEventListener("click", () => {
      const current = party?.queue[0];
      if (current && confirm(`確定要切掉「${current.title}」嗎?`)) skipSong(code, current.id, "大螢幕");
    });

    // ---------- 結束派對 ----------
    $("end-party").addEventListener("click", async () => {
      if (!confirm(`確定要結束派對 ${code} 嗎?\n播放清單和已播放紀錄都會刪除,大家的點歌頁會顯示「派對已結束」。`)) return;
      player?.stopVideo?.();
      await endParty(code);
      location.replace("./");
    });

    // ---------- 畫面 ----------
    subscribe(code, (p) => {
      party = p;
      if (!p) {
        if (loadedSongId) player?.stopVideo();
        loadedSongId = null;
        $("start").hidden = true;
        $("marquee").hidden = true;
        $("skip-btn").hidden = true;
        $("idle").hidden = false;
        $("idle").innerHTML = `<div class="big">派對已結束</div><a class="btn idle-home" href="./">回首頁</a>`;
        return;
      }
      const [current, ...rest] = p.queue;
      $("now").innerHTML = current
        ? `${escapeHtml(current.title)}<div class="by">${escapeHtml(current.by)} 點的</div>`
        : `<span class="by">還沒有人點歌</span>`;
      $("queue").innerHTML = rest.length
        ? rest.map((s, i) => `<li><span class="num">${i + 1}</span>${escapeHtml(s.title)} <span class="by">· ${escapeHtml(s.by)}</span></li>`).join("")
        : `<li class="by">清單是空的</li>`;
      showNotice(p.notice);
      $("paused").hidden = !(p.paused && current);
      $("skip-btn").hidden = !current;
      sync();
      updateMarquee();
    });
  </script>
</body>
</html>
